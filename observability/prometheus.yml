global:
  scrape_interval: 10s

scrape_configs:
  - job_name: cosmos-sdk
    metrics_path: /metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["__NODE_HOST__:1317"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*_Query_([A-Za-z]+)(?:_count|_sum)?'
        target_label: query_name
        replacement: '$1'

  - job_name: cometbft
    static_configs:
      - targets: ["__NODE_HOST__:26660"]
