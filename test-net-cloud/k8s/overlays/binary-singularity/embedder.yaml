apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
  namespace: binary-singularity
  labels:
    app: embedder
    app.kubernetes.io/part-of: gonka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedder
  template:
    metadata:
      labels:
        app: embedder
    spec:
      containers:
      - name: embedder
        image: bs-embedder:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8686
          name: http
        env:
        - name: MODEL_NAME
          value: all-MiniLM-L6-v2
        - name: BATCH_SIZE
          value: "32"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8686
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8686
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: embedder
  namespace: binary-singularity
spec:
  selector:
    app: embedder
  ports:
  - port: 8686
    targetPort: 8686
    name: http
  type: ClusterIP
