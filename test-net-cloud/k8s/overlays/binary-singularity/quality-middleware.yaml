apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-middleware
  namespace: binary-singularity
  labels:
    app: quality-middleware
    app.kubernetes.io/part-of: gonka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quality-middleware
  template:
    metadata:
      labels:
        app: quality-middleware
    spec:
      containers:
      - name: quality-middleware
        image: bs-quality-middleware:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: http
        env:
        - name: UPSTREAM_URL
          value: "http://api.default:9200"
        - name: LISTEN_PORT
          value: "9090"
        - name: EPOCH_DURATION_SECS
          value: "600"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /quality/stats
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /quality/stats
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: quality-middleware
  namespace: binary-singularity
spec:
  selector:
    app: quality-middleware
  ports:
  - port: 9090
    targetPort: 9090
    name: http
  type: ClusterIP
