name: Go Build and Test

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  check-storage-ddl:
    # Pinned runner because the ripgrep apt version below only exists in the
    # 22.04 (jammy) package archive. Bumping the runner requires bumping the
    # pinned ripgrep version in lockstep.
    runs-on: ubuntu-22.04
    name: Storage schema DDL guard
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install ripgrep
        # Pin the package version so the DDL guard runs against a known
        # ripgrep build (reproducible CI). Update both pins together.
        run: sudo apt-get update && sudo apt-get install -y ripgrep=13.0.0-2

      - name: Check storage DDL placement
        run: bash scripts/check-storage-ddl.sh

  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test chain
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./inference-chain

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o ./build/inferenced ./cmd/inferenced/main.go

      # ---------------- Fork PRs: console output only ----------------
      - name: Run Tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test ./... -v

      # ---------------- Internal PRs / main: JUnit + checks ----------------
      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: node-junit-report
          path: inference-chain/junit-report.xml

      - name: Report Test Results in GitHub
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: Inferenced Tests
          path: inference-chain/junit-report.xml
          reporter: java-junit

  build-and-test-api:
    runs-on: ubuntu-latest
    name: Build and Test API Wrapper
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./decentralized-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      # Fork PRs: readable logs only
      - name: Run Tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test ./... -v

      # Internal PRs / main: JUnit + checks
      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: api-junit-report
          path: decentralized-api/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Decentralized-API Tests
          path: decentralized-api/junit-report.xml
          reporter: java-junit

  versioned-e2e:
    runs-on: ubuntu-latest
    name: Versioned E2E
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./versioned

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3.0.0
        with:
          go-version: '1.24.2'

      - name: Install uv (e2e-report JUnit merge)
        run: pip install uv

      - name: Run E2E tests
        run: make e2e

      - name: Publish E2E JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: versioned-e2e-junit-report
          path: versioned/build/test-results/e2e-junit.xml

      - name: Report E2E results in GitHub
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Versioned E2E
          path: versioned/build/test-results/e2e-junit.xml
          reporter: java-junit

  build-and-test-versioned:
    runs-on: ubuntu-latest
    name: Build and Test Versioned
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./versioned

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      # Host shutdown races readiness promotion, admission leases, child reaping,
      # and force signals. Keep the detector on the mandatory versioned suite.
      - name: Run Tests with race detector (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test -race ./... -v

      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests with race detector and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test -race ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: versioned-junit-report
          path: versioned/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Versioned Tests
          path: versioned/junit-report.xml
          reporter: java-junit

  # The routers are HAProxy config plus a render script. test-render renders every
  # supported shape, asserts on the result, and validates each rendered file with
  # the real HAProxy from the image the routers ship.
  test-router-config:
    runs-on: ubuntu-latest
    name: Test router config rendering
    strategy:
      matrix:
        router: [versiond-router, edge-api-router, proxy-router]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Render and validate ${{ matrix.router }} config
        run: make -C ${{ matrix.router }} test-render

      - name: Exercise proxy-router HA routing
        if: matrix.router == 'proxy-router'
        run: make -C proxy-router test-routing

      - name: Exercise isolated versiond-router slots
        if: matrix.router == 'versiond-router'
        run: make -C versiond-router test-fleet

  test-proxy-policy-config:
    runs-on: ubuntu-latest
    name: Test nginx policy rendering
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Render and validate private nginx policy config
        run: make -C proxy test-render

  build-and-test-edge-api:
    runs-on: ubuntu-latest
    name: Build and Test edge-api (validation)
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('edge-api/go.sum', 'common/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          (cd edge-api && go mod download)
          (cd common && go mod download)

      - name: Build edge-api
        working-directory: edge-api
        run: go build ./...

      # The module's own unit tests — readiness, the drain sequence, config
      # validation. The JUnit step below covers common/queryapi only, and for a
      # while nothing ran these at all.
      - name: Run edge-api unit tests
        working-directory: ./edge-api
        run: go test -race ./...

      - name: Run edge-api tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: bash scripts/validate-edge-api.sh

      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      # queryapi lives in common/ (shared by edge-api + dapi); edge-api only mounts it.
      - name: Run edge-api tests and generate JUnit report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: |
          (cd common && go test ./queryapi/... -count=1 -v 2>&1) | go-junit-report -set-exit-code > edge-api/junit-report.xml
          bash scripts/validate-edge-api.sh

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: edge-api-junit-report
          path: edge-api/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: edge-api Tests
          path: edge-api/junit-report.xml
          reporter: java-junit

  build-and-test-devshard:
    runs-on: ubuntu-22.04
    name: Build and Test Devshard
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./devshard

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install ripgrep
        # Pin the package version for reproducible CI; keep in sync with runner image.
        run: sudo apt-get update && sudo apt-get install -y ripgrep=13.0.0-2

      - name: Build
        run: go build ./...

      - name: Run Tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test ./... -v

      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Verify Docker Installation
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: |
          docker --version
          docker compose version

      - name: Run E2E Tests
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: make e2e

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: devshard-junit-report
          path: devshard/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Devshard Tests
          path: devshard/junit-report.xml
          reporter: java-junit

      - name: Publish E2E Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: devshard-e2e-junit-report
          path: devshard/build/test-results/e2e/junit.xml

      - name: Report E2E Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Devshard E2E Tests
          path: devshard/build/test-results/e2e/junit.xml
          reporter: java-junit
