name: Go Build and Test

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  check-storage-ddl:
    # Pinned runner because the ripgrep apt version below only exists in the
    # 22.04 (jammy) package archive. Bumping the runner requires bumping the
    # pinned ripgrep version in lockstep.
    runs-on: ubuntu-22.04
    name: Storage schema DDL guard
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install ripgrep
        # Pin the package version so the DDL guard runs against a known
        # ripgrep build (reproducible CI). Update both pins together.
        run: sudo apt-get update && sudo apt-get install -y ripgrep=13.0.0-2

      - name: Check storage DDL placement
        run: bash scripts/check-storage-ddl.sh

  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test chain
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./inference-chain

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o ./build/inferenced ./cmd/inferenced/main.go

      # ---------------- Fork PRs: console output only ----------------
      - name: Run Tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test ./... -v

      # ---------------- Internal PRs / main: JUnit + checks ----------------
      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: node-junit-report
          path: inference-chain/junit-report.xml

      - name: Report Test Results in GitHub
        uses: dorny/test-reporter@v1
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: Inferenced Tests
          path: inference-chain/junit-report.xml
          reporter: java-junit

  build-and-test-api:
    runs-on: ubuntu-latest
    name: Build and Test API Wrapper
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./decentralized-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      # Fork PRs: readable logs only
      - name: Run Tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test ./... -v

      # Internal PRs / main: JUnit + checks
      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: api-junit-report
          path: decentralized-api/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Decentralized-API Tests
          path: decentralized-api/junit-report.xml
          reporter: java-junit

  versioned-e2e:
    runs-on: ubuntu-latest
    name: Versioned E2E
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./versioned

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3.0.0
        with:
          go-version: '1.24.2'

      - name: Install uv (e2e-report JUnit merge)
        run: pip install uv

      - name: Run E2E tests
        run: make e2e

      - name: Publish E2E JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: versioned-e2e-junit-report
          path: versioned/build/test-results/e2e-junit.xml

      - name: Report E2E results in GitHub
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Versioned E2E
          path: versioned/build/test-results/e2e-junit.xml
          reporter: java-junit

  build-and-test-versioned:
    runs-on: ubuntu-latest
    name: Build and Test Versioned
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./versioned

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run Tests with race detector (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test -race ./... -v

      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests with race detector and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test -race ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: versioned-junit-report
          path: versioned/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Versioned Tests
          path: versioned/junit-report.xml
          reporter: java-junit

  test-versiond-router-config:
    runs-on: ubuntu-latest
    name: Test versiond-router HAProxy configuration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Render and exercise versiond-router
        run: make -C versiond-router test-render
      - name: Exercise isolated versiond-router fleet rollouts
        run: make -C versiond-router test-fleet
      - name: Gate router fleet failure scenarios
        run: |
          shellcheck -x deploy/join/versiond-router-fleet.sh deploy/join/versiond-router-fleet-regression_test.sh
          deploy/join/versiond-router-fleet-regression_test.sh --gate

  test-public-proxy-router:
    runs-on: ubuntu-latest
    name: Test public HAProxy and private nginx policy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Render public proxy configuration
        run: make -C proxy-router test-render
      - name: Render join Compose routing topologies
        run: make -C proxy-router test-compose
      - name: Exercise route-aware failover
        run: make -C proxy-router test-routing
      - name: Render private policy configuration
        run: make -C proxy test-render

  test-proxy-ssl-install:
    runs-on: ubuntu-latest
    name: Test proxy TLS certificate publication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Exercise atomic certificate installation
        run: ./proxy/setup-ssl_test.sh

      - name: Build proxy image
        run: docker build -t gonka-proxy-ssl-recovery-test ./proxy

      - name: Exercise HTTPS recovery from a damaged certificate
        run: ./proxy/ssl-recovery_test.sh

  build-and-test-edge-api:
    runs-on: ubuntu-latest
    name: Build and Test edge-api (validation)
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('edge-api/go.sum', 'common/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          (cd edge-api && go mod download)
          (cd common && go mod download)

      - name: Build edge-api
        working-directory: edge-api
        run: go build ./...

      - name: Run edge-api tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: bash scripts/validate-edge-api.sh

      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      # queryapi lives in common/ (shared by edge-api + dapi); edge-api only mounts it.
      - name: Run edge-api tests and generate JUnit report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: |
          (cd common && go test ./queryapi/... -count=1 -v 2>&1) | go-junit-report -set-exit-code > edge-api/junit-report.xml
          bash scripts/validate-edge-api.sh

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: edge-api-junit-report
          path: edge-api/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: edge-api Tests
          path: edge-api/junit-report.xml
          reporter: java-junit

  build-and-test-devshard:
    runs-on: ubuntu-22.04
    name: Build and Test Devshard
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./devshard

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Install ripgrep
        # Pin the package version for reproducible CI; keep in sync with runner image.
        run: sudo apt-get update && sudo apt-get install -y ripgrep=13.0.0-2

      - name: Build
        run: go build ./...

      - name: Run devshardd lifecycle tests with race detector
        run: go test -race ./cmd/devshardd

      - name: Run Tests (fork PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        run: go test ./... -v

      - name: Install go-junit-report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run Tests and Generate JUnit Report
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: go test ./... -v 2>&1 | go-junit-report -set-exit-code > junit-report.xml

      - name: Verify Docker Installation
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: |
          docker --version
          docker compose version

      - name: Run E2E Tests
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: make e2e

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: devshard-junit-report
          path: devshard/junit-report.xml

      - name: Report Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Devshard Tests
          path: devshard/junit-report.xml
          reporter: java-junit

      - name: Publish E2E Test Results
        uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        with:
          name: devshard-e2e-junit-report
          path: devshard/build/test-results/e2e/junit.xml

      - name: Report E2E Test Results in GitHub
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@v1
        with:
          name: Devshard E2E Tests
          path: devshard/build/test-results/e2e/junit.xml
          reporter: java-junit

  test-devshard-postgres-migration:
    runs-on: ubuntu-latest
    name: Test devshard PostgreSQL persistence migration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check migration scripts
        run: |
          shellcheck deploy/join/devshard-postgres-*.sh
          deploy/join/devshard-postgres-entrypoint_test.sh
          deploy/join/devshard-postgres-migration-preflight_test.sh
      - name: Preserve a real PostgreSQL cluster across replacement
        run: deploy/join/devshard-postgres-upgrade_test.sh
