syntax = "proto3";
package devshard.v1;
option go_package = "devshard/types";

enum TimeoutReason {
  TIMEOUT_REASON_UNSPECIFIED = 0;
  TIMEOUT_REASON_REFUSED = 1;
  TIMEOUT_REASON_EXECUTION = 2;
  reserved 3;
  reserved "TIMEOUT_REASON_ERROR";
}

message MsgStartInference {
  uint64 inference_id = 1;
  bytes  prompt_hash = 2;
  string model = 3;
  uint64 input_length = 4;
  uint64 max_tokens = 5;
  reserved 6;
  reserved "started_at";
  uint64 observed_height = 7;
  bytes  observed_block_hash = 8;
  // protocol_version is the destshard runtime the gateway bound for this
  // escrow (approved_versions.name / route prefix). It is inside the
  // user-signed Diff so a later ChallengeReceipt can prove which version
  // may CreateSession on a host the gateway never pinged.
  string protocol_version = 9;
}

message MsgConfirmStart {
  uint64 inference_id = 1;
  bytes  executor_sig = 2;
  reserved 3;
  reserved "confirmed_at";
  uint64 observed_height = 4;
  bytes  observed_block_hash = 5;
}

message MsgFinishInference {
  uint64 inference_id = 1;
  bytes  response_hash = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint32 executor_slot = 5;
  bytes  proposer_sig = 6;
  string escrow_id = 7;
  uint64 observed_height = 8;
  bytes  observed_block_hash = 9;
  bytes  served_hash = 10;
}

message MsgTimeoutInference {
  uint64 inference_id = 1;
  TimeoutReason reason = 2;
  repeated TimeoutVote votes = 3;
}

message TimeoutVote {
  uint32 voter_slot = 1;
  bool   accept = 2;
  bytes  signature = 3;
}

// MsgErrorMiss accounts a finished inference whose signed body is an error
// envelope or malformed stream. Evidence-backed and immediate: verifiers
// check the executor-signed response hash, NOT an elapsed deadline.
// Payload bytes are not on this message — re-derive the hash from the
// Finish that applied earlier in the diff (rec.ResponseHash).
message MsgErrorMiss {
  uint64 inference_id = 1;
  repeated ErrorMissVote votes = 2;
}

message ErrorMissVote {
  uint32 voter_slot = 1;
  bool   accept = 2;
  bytes  signature = 3;
}

// ChallengeReason is why the gateway challenged a finished inference.
// The byte-bound reasons are added after STREAM_UNBOUND and EMPTY_STREAM.
enum ChallengeReason {
  CHALLENGE_REASON_UNSPECIFIED = 0;
  // The stream was cut before [DONE] and devshard_meta, it was complete and
  // matched neither hash the Finish carries, or it was still open a grace
  // after its Finish applied.
  CHALLENGE_REASON_STREAM_UNBOUND = 1;
  // The receipt was applied and the stream ended with no content.
  CHALLENGE_REASON_EMPTY_STREAM = 2;
}

// ChallengeFault is what a voter found on the body it fetched from the
// executor. NONE is a valid vote: the checks this host ran found no fault.
enum ChallengeFault {
  CHALLENGE_FAULT_NONE = 0;
  // The executor did not serve the body for the whole fetch window, said it
  // was gone while the escrow epoch is inside its retention, or sent a body
  // above the size limit.
  CHALLENGE_FAULT_PAYLOAD_UNAVAILABLE = 1;
  // The prompt, the body or the served view does not hash to what the
  // Finish signed, or the executor's payload signature does not verify.
  CHALLENGE_FAULT_HASH_MISMATCH = 2;
  // The body matches its hashes but holds no generated positions.
  CHALLENGE_FAULT_EMPTY_STREAM = 3;
  // The claim is above what the body holds: the token count check, which no
  // voter runs yet.
  CHALLENGE_FAULT_USAGE_INFLATED = 4;
}

// ChallengeCheck names the check behind a fault.
enum ChallengeCheck {
  CHALLENGE_CHECK_UNSPECIFIED = 0;
  CHALLENGE_CHECK_HASH = 1;
  CHALLENGE_CHECK_POSITIONS = 2;
}

// MsgChallenge carries the hosts' signed verdicts on a finished inference the
// gateway challenged. Faults of any kind are summed into one tally; above
// VoteThreshold the inference is invalidated, below it the inference stays
// finished and paid. The executor's own address does not vote, and only the
// first MsgChallenge for an inference counts.
message MsgChallenge {
  uint64 inference_id = 1;
  repeated ChallengeVote votes = 2;
}

// ChallengeVote is one host's signed ChallengeVoteContent. The escrow id,
// the inference id and the response hash come from the state.
message ChallengeVote {
  uint32         voter_slot = 1;
  ChallengeFault fault = 2;
  ChallengeCheck check = 3;
  int64          deviation = 4;
  bytes          signature = 5;
}

message MsgValidation {
  // Proposer_sig is over CanonicalSignedBytes with domain
  // "devshard.validation.v1". Field layout matches MsgValidationVote; the
  // domain tag is what keeps the signatures from being interchangeable.
  uint64 inference_id = 1;
  uint32 validator_slot = 2;
  bool   valid = 3;
  bytes  proposer_sig = 4;
  string escrow_id = 5;
}

message MsgValidationVote {
  // Proposer_sig is over CanonicalSignedBytes with domain
  // "devshard.validationvote.v1". See MsgValidation.
  uint64 inference_id = 1;
  uint32 voter_slot = 2;
  bool   vote_valid = 3;
  bytes  proposer_sig = 4;
  string escrow_id = 5;
}

// Deprecated: retained for wire compatibility; reveal-seed txs are ignored at runtime.
message MsgRevealSeed {
  uint32 slot_id = 1;
  bytes  signature = 2;
  bytes  proposer_sig = 3;
  string escrow_id = 4;
}

message MsgFinalizeRound {
}
