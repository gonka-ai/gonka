# Shared observability services (loki, prometheus, grafana).
# Profile fragments add the trace backend + log collector:
#   docker-compose.observability.jaeger.yml
#   docker-compose.observability.promtail.yml
#   docker-compose.observability.tempo.yml
#   docker-compose.observability.alloy.yml
#
# Default e2e profile (tempo-alloy):
#   TESTENV_OTEL_ENABLED=true TESTENV_OTEL_ENDPOINT=http://alloy:4317 \
#     docker compose -f docker-compose.yml \
#       -f docker-compose.observability.yml \
#       -f docker-compose.observability.tempo.yml \
#       -f docker-compose.observability.alloy.yml \
#       -f docker-compose.observability.ip.yml up -d
#
# Host ports are offset from deploy/join defaults to avoid clashing with a local join stack.

services:
  prometheus:
    image: prom/prometheus:v3.11.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ${TESTENV_OBS_CONFIG_DIR:-.}/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - testenv_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:19099:9090"
    networks:
      - testenv
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.10
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ${TESTENV_OBS_CONFIG_DIR:-.}/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - testenv_loki_data:/loki
    ports:
      - "127.0.0.1:13101:3100"
    networks:
      - testenv
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.1
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin1}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:13000/
    volumes:
      - ${TESTENV_OBS_CONFIG_DIR:-.}/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../deploy/join/observability/grafana/dashboards:/var/lib/grafana/dashboards-src:ro
      - ${TESTENV_OBS_CONFIG_DIR:-.}/observability/grafana/entrypoint.sh:/entrypoint.sh:ro
      - testenv_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - testenv
    restart: unless-stopped

volumes:
  testenv_prometheus_data:
  testenv_loki_data:
  testenv_grafana_data:
