# Testenv stand-in for join `proxy` on DEVSHARD_RPC_H2_PORT.
# JSON/catalog stay on versiond-router:8080; this frontend is the RPC/h2 hop only.
# Backend is versiond-router's proto h2 listen (8081), not the HTTP/1.1 :8080.
#
# Same HAProxy major as proxy-router. Path zones and conn_rate/sess_rate are on
# `src` here so versiond-router does not re-key them (its RemoteAddr is `proxy`).
# Child Attach floor is process-wide and must not use X-Real-IP.
#
# Rates are high enough that a well-behaved citest peer is not false-throttled
# (P6.9 R8). P6.9 lowers them in a one-off stack. Separate stick-tables so a
# GetDiffs flood cannot spend the Chat budget (mutually exclusive ACLs reuse sc1).

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 512
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s

frontend rpc_h2
    bind *:8443 proto h2
    maxconn 4096
    stick-table type ip size 1m expire 10s store conn_rate(1s),sess_rate(1s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_rate(0) gt 200 }
    tcp-request session track-sc0 src
    tcp-request session reject if { sc_sess_rate(0) gt 400 }

    http-request del-header X-Real-IP
    http-request set-header X-Real-IP %[src]

    # Connect/gRPC procedures are /pkg.Service/Method (dot before the service
    # name). path_end /SessionService/Chat never matches that suffix.
    acl is_attach path_end /devshard.transport.v1.PeerAuthService/Attach
    acl is_chat path_end /devshard.transport.v1.SessionService/Chat
    acl is_diffs path_end /devshard.transport.v1.SessionService/GetDiffs
    acl is_mempool path_end /devshard.transport.v1.SessionService/GetMempool
    acl is_signatures path_end /devshard.transport.v1.SessionService/GetSignatures
    acl is_gossip path_end /devshard.transport.v1.GossipService/Nonce /devshard.transport.v1.GossipService/Txs
    acl is_payload path_end /devshard.transport.v1.PayloadService/GetPayload
    acl is_heavy path_end /devshard.transport.v1.SessionService/SeedHeightSync /devshard.transport.v1.SessionService/RepairHeightSync /devshard.transport.v1.SessionService/VerifyTimeout /devshard.transport.v1.SessionService/VerifyErrorMiss /devshard.transport.v1.SessionService/ChallengeReceipt

    http-request track-sc1 src table st_rpc_attach if is_attach
    http-request deny deny_status 429 if is_attach { sc_http_req_rate(1) gt 100 }
    http-request track-sc1 src table st_rpc_chat if is_chat
    http-request deny deny_status 429 if is_chat { sc_http_req_rate(1) gt 500 }
    http-request track-sc1 src table st_rpc_diffs if is_diffs
    http-request deny deny_status 429 if is_diffs { sc_http_req_rate(1) gt 400 }
    http-request track-sc1 src table st_rpc_mempool if is_mempool
    http-request deny deny_status 429 if is_mempool { sc_http_req_rate(1) gt 400 }
    http-request track-sc1 src table st_rpc_signatures if is_signatures
    http-request deny deny_status 429 if is_signatures { sc_http_req_rate(1) gt 600 }
    http-request track-sc1 src table st_rpc_gossip if is_gossip
    http-request deny deny_status 429 if is_gossip { sc_http_req_rate(1) gt 200 }
    http-request track-sc1 src table st_rpc_payload if is_payload
    http-request deny deny_status 429 if is_payload { sc_http_req_rate(1) gt 200 }
    http-request track-sc1 src table st_rpc_heavy if is_heavy
    http-request deny deny_status 429 if is_heavy { sc_http_req_rate(1) gt 200 }

    default_backend versiond_router_h2

backend st_rpc_attach
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend st_rpc_chat
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend st_rpc_diffs
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend st_rpc_mempool
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend st_rpc_signatures
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend st_rpc_gossip
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend st_rpc_payload
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend st_rpc_heavy
    stick-table type ip size 1m expire 10s store http_req_rate(10s)

backend versiond_router_h2
    server router versiond-router:8081 proto h2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
