// Phase 2: gRPC surface for the testenv mock-chain service.
//
// The proto mirrors the current devshard/bridge.MainnetBridge query and
// action shape so devshard/testenv/bridge.GRPCBridge (Phase 4) can satisfy
// the production bridge interface without any adapter glue.
//
// See devshard/docs/testenv.md §Phase 2 and §3.
syntax = "proto3";

package devshard.testenv.mockchain.v1;

option go_package = "devshard/testenv/proto/mockchainpb;mockchainpb";

// MockChain consolidates mainnet-query and mainnet-tx surfaces behind a
// single service. We do not split Query and Tx the way Cosmos does
// because the testenv has no wallet, no block cadence, and no mempool:
// every call is a synchronous RPC against in-memory state.
service MockChain {
  // GetDevshardEscrow returns the seeded escrow by id.
  rpc GetDevshardEscrow(GetDevshardEscrowRequest) returns (GetDevshardEscrowResponse);

  // GetParticipant returns the host address → URL mapping.
  rpc GetParticipant(GetParticipantRequest) returns (GetParticipantResponse);

  // GetGrantees enumerates warm-key grantees for (cold) validator_address.
  // The testenv returns every participant address so warm-key checks always pass.
  rpc GetGrantees(GetGranteesRequest) returns (GetGranteesResponse);

  // CreateEscrow (re-)seeds the pre-configured escrow. Idempotent; mainly
  // used by operator tooling that asserts the chain state before starting
  // a run.
  rpc CreateEscrow(CreateEscrowRequest) returns (CreateEscrowResponse);

  // SettleEscrow submits a settlement payload to be verified against the
  // pinned group. The server runs devshard/state.VerifySettlement.
  rpc SettleEscrow(SettleEscrowRequest) returns (SettleEscrowResponse);
}

// ── Query messages ────────────────────────────────────────────────────────────

message GetDevshardEscrowRequest {
  string escrow_id = 1;
}

message GetDevshardEscrowResponse {
  string escrow_id       = 1;
  uint64 amount          = 2;
  string creator_address = 3;
  bytes  app_hash        = 4;
  repeated string slots  = 5;
  uint64 token_price     = 6;
}

message GetParticipantRequest {
  string address = 1;
}

message GetParticipantResponse {
  string address = 1;
  string url     = 2;
}

message GetGranteesRequest {
  string validator_address = 1;
  string message_type      = 2;
}

message GetGranteesResponse {
  repeated string addresses = 1;
}

// ── Tx messages ───────────────────────────────────────────────────────────────

message CreateEscrowRequest {
  // Optional override; the server uses the config default when empty.
  string escrow_id = 1;
}

message CreateEscrowResponse {
  string escrow_id = 1;
}

// HostStats carries per-slot accounting for settlement verification.
// Shape must stay in lockstep with devshard/types.HostStats; the mapping is
// validated in tests.
message HostStats {
  uint32 slot_id               = 1;
  uint32 missed                = 2;
  uint32 invalid               = 3;
  uint64 cost                  = 4;
  uint32 required_validations  = 5;
  uint32 completed_validations = 6;
}

// SlotSignature pairs a slot id with the host's signature over the
// serialized StateSignatureContent (see devshard/state/settlement.go).
message SlotSignature {
  uint32 slot_id   = 1;
  bytes  signature = 2;
}

message SettleEscrowRequest {
  string                 escrow_id  = 1;
  // version is required; empty values are rejected to match
  // state.VerifySettlement which also rejects an empty version.
  string                 version    = 2;
  uint64                 nonce      = 3;
  uint64                 fees       = 4;
  bytes                  rest_hash  = 5;
  repeated HostStats     host_stats = 6;
  repeated SlotSignature signatures = 7;
}

message SettleEscrowResponse {
  bool   ok         = 1;
  string message    = 2;
  // state_root is populated only when ok=true; it is the root the server
  // recomputed from the payload.
  bytes  state_root = 3;
}
