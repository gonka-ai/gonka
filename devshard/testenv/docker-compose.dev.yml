# Dev overlay: applied on top of docker-compose.yml to enable live-reload
# (air) and remote debugging (dlv) inside every testenv container.
#
# Usage:
#   docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.dev.yml \
#       up -d
#
# Note: run `make gen-compose` first to generate/update
# `docker-compose.yml` and `config.yaml`.
#
# Or via the Makefile: `make dev-up`.
#
# What this overlay does per service:
#   1. Swaps `build.dockerfile` to Dockerfile.dev and the image tag to
#      `devshard-dev:latest`, so every service shares one toolchain
#      image and only one `go mod download` layer.
#   2. Replaces `command:` with `air -c <config>` pointing at the
#      per-service .air.*.toml checked in next to this file.
#   3. Bind-mounts the repo root at /workspace so source edits land in
#      the container instantly; air watches /workspace/devshard/** and
#      rebuilds on change.
#   4. Shares module + build caches via named volumes so parallel
#      rebuilds across hosts don't re-download modules.
#   5. For debug-enabled services (mock-chain, height-sync,
#      devshardd-testenv-0): adds cap_add [SYS_PTRACE] + security_opt
#      seccomp:unconfined (required for dlv under Docker Desktop) and
#      publishes the dlv listener port on the host.
#
# Debug port map:
#   - :2345 → mock-chain
#   - :2346 → height-sync
#   - :2347 → devshardd-testenv-0
# Hosts 1..N-1 run live-reload but no dlv wrapper to keep the
# multi-host overlay responsive on laptops.
#
# Scaling: the overlay statically enumerates the default 4 devshardd
# replicas emitted by gencompose. Changing `escrow.slots` or adding
# hosts in config.yaml requires rerunning `make gen-compose`; if the
# new host count exceeds 4, duplicate the devshardd-testenv-N block
# below (or run those extra hosts without the dev overlay).
#
# Phase 12; see devshard/docs/testenv.md §Phase 12 for the full spec.

services:

  # ── Mock mainnet (dlv) ────────────────────────────────────────────────────
  mock-chain:
    build:
      context: ../..
      dockerfile: devshard/testenv/Dockerfile.dev
    image: devshard-dev:latest
    command: ["-c", "/workspace/devshard/testenv/.air.mock-chain.debug.toml"]
    # Must match `root` in .air.*.toml (/workspace/devshard): build cmds use ./testenv/cmd/...
    working_dir: /workspace/devshard
    volumes:
      - ../..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "2345:2345"

  # ── Height-sync (dlv) ─────────────────────────────────────────────────────
  height-sync:
    build:
      context: ../..
      dockerfile: devshard/testenv/Dockerfile.dev
    image: devshard-dev:latest
    command: ["-c", "/workspace/devshard/testenv/.air.height-sync.debug.toml"]
    working_dir: /workspace/devshard
    volumes:
      - ../..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "2346:2346"

  # ── devshardd-testenv-0 (dlv, first host) ─────────────────────────────────
  devshardd-testenv-0:
    build:
      context: ../..
      dockerfile: devshard/testenv/Dockerfile.dev
    image: devshard-dev:latest
    command: ["-c", "/workspace/devshard/testenv/.air.devshardd.debug.toml"]
    working_dir: /workspace/devshard
    environment:
      DLV_PORT: "2347"
    volumes:
      - ../..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ports:
      - "2347:2347"

  # ── devshardd-testenv-1 (live-reload only) ────────────────────────────────
  devshardd-testenv-1:
    build:
      context: ../..
      dockerfile: devshard/testenv/Dockerfile.dev
    image: devshard-dev:latest
    command: ["-c", "/workspace/devshard/testenv/.air.devshardd.toml"]
    working_dir: /workspace/devshard
    volumes:
      - ../..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  # ── devshardd-testenv-2 (live-reload only) ────────────────────────────────
  devshardd-testenv-2:
    build:
      context: ../..
      dockerfile: devshard/testenv/Dockerfile.dev
    image: devshard-dev:latest
    command: ["-c", "/workspace/devshard/testenv/.air.devshardd.toml"]
    working_dir: /workspace/devshard
    volumes:
      - ../..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  # ── devshardd-testenv-3 (live-reload only) ────────────────────────────────
  devshardd-testenv-3:
    build:
      context: ../..
      dockerfile: devshard/testenv/Dockerfile.dev
    image: devshard-dev:latest
    command: ["-c", "/workspace/devshard/testenv/.air.devshardd.toml"]
    working_dir: /workspace/devshard
    volumes:
      - ../..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  # ── devshardctl (live-reload overlay) ─────────────────────────────────────
  devshardctl:
    build:
      context: ../..
      dockerfile: devshard/testenv/Dockerfile.dev
    image: devshard-dev:latest
    command: ["-c", "/workspace/devshard/testenv/.air.devshardctl.toml"]
    working_dir: /workspace/devshard
    volumes:
      - ../..:/workspace
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

volumes:
  # Named volumes survive `docker compose down` (use `down -v` to wipe)
  # so iterating on a single host after `dev-up` doesn't re-download
  # the module graph from proxy.golang.org each time.
  gomodcache:
  gobuildcache:
