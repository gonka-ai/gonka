# air + dlv config for devshardd-testenv hosts.
# Phase 12; see devshard/docs/testenv.md §Phase 12.
#
# Debug port is per-host: 2347 for host 0, 2348 for host 1, 2349 for
# host 2, 2350 for host 3. The actual port is selected via the DLV_PORT
# environment variable set by docker-compose.dev.yml.

root = "/workspace"
tmp_dir = "/tmp/air/devshardd"

[build]
  cmd = "go build -gcflags 'all=-N -l' -o /tmp/air/devshardd/devshardd-testenv ./devshard/testenv/cmd/devshardd-testenv"
  bin = "sh -c 'dlv exec /tmp/air/devshardd/devshardd-testenv --listen=:${DLV_PORT:-2347} --headless=true --api-version=2 --accept-multiclient --continue --'"
  include_ext = ["go", "yaml", "proto"]
  exclude_dir = ["observability", "testenv/docs", "docs"]
  delay = 500

[log]
  main_only = false

[misc]
  clean_on_exit = true
