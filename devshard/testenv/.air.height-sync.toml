# air live-reload config for the height-sync service.
# Phase 12; see devshard/docs/testenv.md §Phase 12.

root = "/workspace/devshard"
tmp_dir = "/tmp/air/height-sync"

[build]
  cmd = "go build -o /tmp/air/height-sync/heightsyncd ./testenv/cmd/heightsyncd"
  bin = "/tmp/air/height-sync/heightsyncd"
  include_ext = ["go", "yaml", "toml"]
  exclude_dir = [
    ".git",
    "docs",
    "testenv/docs",
    "testenv/observability",
    "testenv/db",
  ]
  delay = 500
  kill_delay = "1s"
  stop_on_error = true

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true
