# Grafana datasource provisioning for the devshard testenv.
# Phase 13; see devshard/docs/testenv.md §Phase 13.
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
