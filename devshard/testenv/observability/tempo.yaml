# Tempo local-blocks config for testenv (T2).
# Apps reach Tempo via Alloy (tempo-alloy) or directly (tempo-promtail).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs: {}
    span_metrics:
      dimensions:
        - model
        - devshard.disposition
        - devshard.dispatch_phase
        - devshard.quarantine_mode
        - devshard.no_send_reason
        - devshard.failure_origin
        - devshard.timeout_kind
        - devshard.timeout_outcome

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

querier:
  max_concurrent_queries: 20

query_frontend:
  search:
    max_duration: 0s
