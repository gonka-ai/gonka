# Fixed IPs on the testenv bridge (high slot .60+) so observability containers
# do not collide with gencompose static assignments (.2–.11).
# Default profile: tempo-alloy (no jaeger/promtail blocks — Compose rejects
# unknown services). Citest regenerates this per profile.

services:
  prometheus:
    networks:
      testenv:
        ipv4_address: 172.30.0.61
  loki:
    networks:
      testenv:
        ipv4_address: 172.30.0.62
  grafana:
    networks:
      testenv:
        ipv4_address: 172.30.0.64
  tempo:
    networks:
      testenv:
        ipv4_address: 172.30.0.65
  alloy:
    networks:
      testenv:
        ipv4_address: 172.30.0.66
