schema_version: v1
scenario: qwen-two-models-smoke
seed: 1515

topology:
  versiond_mode: multi
  storage: per_participant
  participants: 3
  chain:
    escrow_amount: 2000000000000000
    max_nonce: 100000
  mock_ml:
    allocator: round_robin
    nodes:
      - {name: mock-openai-0, profile: fast}
      - {name: mock-openai-1, profile: fast}

workload:
  max_in_flight: 2
  duration: 30s
  traffic:
    type: constant
    rps: 2
  request:
    timeout: 90s
    # Fallback for a run without -load-dataset; dataset rows replace these fields.
    messages:
      - {role: user, content: "Explain what a queue is in one sentence."}
    max_tokens: 64
    stream: false
    mix:
      models:
        - {value: Qwen/Qwen3-4B-Instruct-2507, weight: 50}
        - {value: Qwen/Qwen2.5-7B-Instruct, weight: 50}

assertions:
  requests:
    http_status: 200
    terminal_outcome: completed
    error_rate: 0
  devshard:
    no_orphaned_work: true
    max_ghost_rate: 0.02
  mock_ml:
    require_each_node_used: true

drain_timeout: 30s
