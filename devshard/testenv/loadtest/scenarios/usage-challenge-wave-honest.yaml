schema_version: v1
scenario: usage-challenge-wave-honest
seed: 1515

# The control of usage-challenge-wave: the same stack and load with every ML node honest, so the
# gateway challenges nothing. What the wave run costs above this one is the challenge's. Each host draws
# only from its own node, mock-openai-N on versiond-N, as in that run.
topology:
  versiond_mode: multi
  storage: per_participant
  participants: 5
  chain:
    escrow_amount: 5000000000
    max_nonce: 100000
    escrows: 4
  mock_ml:
    allocator: round_robin
    nodes:
      - name: mock-openai-0
        profile: fast
        host: versiond-0
      - name: mock-openai-1
        profile: fast
        host: versiond-1
      - name: mock-openai-2
        profile: fast
        host: versiond-2
      - name: mock-openai-3
        profile: fast
        host: versiond-3
      - name: mock-openai-4
        profile: fast
        host: versiond-4
      - name: mock-openai-5
        profile: fast
        host: versiond-5

protocol:
  refusal_timeout: 5s
  execution_timeout: 90s

workload:
  max_in_flight: 256
  duration: 10m
  report_interval: 30s
  traffic:
    type: stages
    stages:
      - duration: 1m
        rps: 8
      - duration: 5m
        rps: 32
      - duration: 4m
        rps: 8
  request:
    model: test-model
    # The gateway streams every execution from the ML node whatever the client asked.
    stream: false
    max_tokens: 128
    messages:
      - role: user
        content: "usage challenge wave request"

gateway:
  participant_throttle:
    empty_stream_quarantine: 1s

assertions:
  requests:
    http_status: 200
    terminal_outcome: completed
    error_rate: 0.05
  devshard:
    no_orphaned_work: true
    max_ghost_rate: 0.05
  mock_ml:
    require_each_node_used: true
  promises: true

diagnostics:
  export: true
  logs:
    tail: all

drain_timeout: 3m
