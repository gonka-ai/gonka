schema_version: v1
scenario: normal-load
seed: 42

topology:
  versiond_mode: multi
  storage: per_participant
  participants: 3
  chain:
    escrow_amount: 1000000000
    max_nonce: 100000
  mock_ml:
    allocator: round_robin
    nodes:
      - name: mock-openai-0
        profile: fast
      - name: mock-openai-1
        profile: fast

workload:
  mode: closed_loop
  concurrency: 2
  duration: 30s
  request:
    model: test-model
    stream: false
    max_tokens: 64
    messages:
      - role: user
        content: "normal-load request"

thresholds:
  error_rate: 0

assertions:
  requests:
    http_status: 200
    terminal_outcome: completed
  devshard:
    no_orphaned_work: true
    require_drain: true
    max_ghost_rate: 0.02
  mock_ml:
    require_each_node_used: true

drain_timeout: 30s
