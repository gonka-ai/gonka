schema_version: v1
scenario: normal-load-real-dapi
seed: 42

environment:
  chain: local_testnet
  dapi: real

topology:
  versiond_mode: multi
  storage: per_participant
  participants: 3
  chain:
    escrow_amount: 1000000000
    max_nonce: 100000
  mock_ml:
    allocator: dapi
    nodes:
      - name: mock-openai-0
        profile: fast
      - name: mock-openai-1
        profile: fast

workload:
  max_in_flight: 2
  duration: 30s
  traffic:
    type: closed_loop
  request:
    model: Qwen/Qwen2.5-7B-Instruct
    stream: false
    max_tokens: 64
    messages:
      - role: user
        content: "normal-load request"

thresholds:
  error_rate: 0

assertions:
  requests:
    http_status: 200
    terminal_outcome: completed
  devshard:
    no_orphaned_work: true
    require_drain: true
    max_ghost_rate: 0.02
  mock_ml:
    require_each_node_used: true

drain_timeout: 30s
