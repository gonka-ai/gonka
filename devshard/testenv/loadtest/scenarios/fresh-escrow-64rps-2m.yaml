schema_version: v1
scenario: fresh-escrow-64rps-2m
seed: 42

topology:
  versiond_mode: multi
  storage: per_participant
  participants: 3
  chain:
    escrow_amount: 2000000000000000
    max_nonce: 100000
  mock_ml:
    allocator: round_robin
    nodes:
      - name: mock-openai-0
        profile: fast
      - name: mock-openai-1
        profile: fast
      - name: mock-openai-2
        profile: fast
      - name: mock-openai-3
        profile: fast

workload:
  max_in_flight: 64
  duration: 2m
  report_interval: 10s
  traffic:
    type: constant
    rps: 64
  request:
    model: test-model
    stream: false
    max_tokens: 64
    messages:
      - role: user
        content: "fresh escrow load test request"

gateway:
  redundancy:
    secondary_wait_after_winner: 30s
  escrow_rotation:
    enabled: false

assertions:
  requests:
    http_status: 200
    terminal_outcome: completed
    error_rate: 0
  devshard:
    no_orphaned_work: true
    max_ghost_rate: 0.02
  mock_ml:
    require_each_node_used: true

drain_timeout: 2m

diagnostics:
  cpu_profiles:
    - start_after: 5s
      duration: 30s
    - start_after: 80s
      duration: 30s
