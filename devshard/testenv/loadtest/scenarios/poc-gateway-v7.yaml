schema_version: v1
scenario: poc-gateway-v7
seed: 47

# Four identities, five containers: versiond-0/1 are one HA participant.
topology:
  versiond_mode: multi
  storage: per_participant
  participants: 4
  chain:
    escrow_amount: 2000000000000000
    max_nonce: 1000000
  mock_ml:
    allocator: round_robin
    nodes:
      - {name: mock-openai-0, profile: prod-like, host: versiond-0}
      - {name: mock-openai-1, profile: prod-like, host: versiond-1}
      - {name: mock-openai-2, profile: prod-like, host: versiond-2}
      - {name: mock-openai-3, profile: prod-like, host: versiond-3}
      - {name: mock-openai-4, profile: prod-like, host: versiond-4}

protocol:
  refusal_timeout: 5s
  execution_timeout: 90s

workload:
  # Baseline 0-2m, PoC 2-3m30s, recovery, cPoC 5-6m30s, final recovery.
  duration: 8m
  request_timeout: 2m
  report_interval: 30s
  max_in_flight: 128
  traffic:
    type: constant
    rps: 8
  request:
    model: test-model
    stream: true
    max_tokens: 128
    messages:
      - {role: user, content: "Explain why a distributed inference network needs redundancy."}
  events:
    - id: poc-preserved-p0
      action: poc_window
      at: 2m
      until: 3m30s
      params: {kind: poc, preserved: versiond-0}
    - id: cpoc-preserved-p1
      action: poc_window
      at: 5m
      until: 6m30s
      params: {kind: cpoc, preserved: versiond-2}

# v7 names the gateway rewrite branch, while the image and hosts speak v2.
gateway:
  implementation: gateway
  image: local/gateway:46ce696a-v2
  protocol: v2
  poc_request_mode: relaxed
  engine_loser_grace: 30s
  escrow_rotation:
    enabled: false

assertions:
  requests:
    http_status: 200
    terminal_outcome: completed
    error_rate: 0.10
  devshard:
    no_orphaned_work: true
    max_ghost_rate: 0.02
  invariants:
    enabled: true
    # Legacy accounting/quarantine checks are outside this scenario's scope.
    checks: [poc-load, faults-fired-and-ml-nodes-bound]
    baseline: {from: 30s, to: 1m30s}
    trend_early: {from: 30s, to: 1m30s}
    trend_late: {from: 7m, to: 8m}

drain_timeout: 3m

diagnostics:
  logs: {tail: all}
  cpu_profiles:
    - {start_after: 1m, duration: 20s}
    - {start_after: 2m30s, duration: 20s}
    - {start_after: 5m30s, duration: 20s}
    - {start_after: 7m, duration: 20s}
