syntax = "proto3";
package inference.inference;

option go_package = "github.com/productscience/inference/x/inference/types";

message RandomSeed {
  string participant = 1;
  uint64 epoch_index = 2;
  string signature = 3;
  int64  seed = 4; // The seed value derived from signing epoch_index, stored for on-chain access
  // epoch group id?
}
