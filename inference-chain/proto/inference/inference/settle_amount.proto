syntax = "proto3";
package inference.inference;

option go_package = "github.com/productscience/inference/x/inference/types";

message SettleAmount {
  string participant = 1;
  uint64 reward_coins = 2;
  uint64 work_coins = 3;
  uint64 epoch_index = 4;
  string seed_signature = 5;
  int64 last_claim_attempt = 6;
  // Storage form of seed_signature (decoded hex); reads restore the string.
  bytes seed_signature_raw = 7;
}

