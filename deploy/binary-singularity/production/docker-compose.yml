version: "3.9"

# ── PRODUCTION: Binary Singularity on real Gonka node infrastructure ──────────
#
# This stack runs ON TOP of the existing node deploy (deploy/join/).
# It adds the binary singularity layer (embedder, slot store, quality-middleware)
# to a real DAPI + mlnode + node stack that uses GNK tokens for inference.
#
# Architecture:
#   ┌─────────────────────────────────────────────────────┐
#   │  EXISTING NODE (deploy/join)                        │
#   │  tmkms → node → api (DAPI :9000/:9100/:9200)       │
#   │  mlnode-308 → inference (nginx :8080/:5050)         │
#   └───────────────────┬─────────────────────────────────┘
#                       │
#   ┌───────────────────┴─────────────────────────────────┐
#   │  BINARY SINGULARITY LAYER (this file)               │
#   │  embedder (:8686) → quality-middleware (:9090)       │
#   │  opengnk (:8080) → proxy for SDK clients            │
#   │  bs-runtime: slot store + mesh CPU pool              │
#   └─────────────────────────────────────────────────────┘
#
# Quick start:
#   cd deploy/binary-singularity/production
#   cp .env.example .env && nano .env   # fill GONKA keys
#   docker compose up -d
#
# Requires: existing node running (deploy/join docker-compose up)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Embedder: CPU-only, all-MiniLM-L6-v2 (384 dims) ──────────────────────
  # Used by DAPI semantic cache (L2) and binary singularity slot distillation.
  # DAPI connects via DAPI_CACHE__EMBEDDER_URL env var.
  embedder:
    image: bs-embedder:latest
    build:
      context: ../../../binary-singularity
      dockerfile: Dockerfile.embedder
    restart: unless-stopped
    ports:
      - "${EMBED_PORT:-8686}:8686"
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
      - BATCH_SIZE=32
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8686/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── opengnk: OpenAI-compatible proxy for SDK clients ──────────────────────
  # Source: https://github.com/gonkalabs/opengnk/tree/dev
  # Clients connect to this instead of directly to DAPI.
  # Handles: secp256k1 signing, Transfer Agent whitelist, multi-wallet rotation,
  #          tool-call simulation, privacy sanitization (optional).
  opengnk:
    image: ghcr.io/gonkalabs/opengnk:dev
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${OPENGNK_PORT:-8080}:8080"
    environment:
      - GONKA_PRIVATE_KEY=${GONKA_PRIVATE_KEY}
      - GONKA_ADDRESS=${GONKA_ADDRESS}
      - GONKA_WALLETS=${GONKA_WALLETS:-}
      - GONKA_SOURCE_URL=${GONKA_SOURCE_URL:-http://node2.gonka.ai:8000}
      - SIMULATE_TOOL_CALLS=${SIMULATE_TOOL_CALLS:-false}
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Quality middleware: L6/L8/L9/DX measurement + mesh CPU pool search ────
  # Wraps either opengnk (for SDK clients) or DAPI admin (:9200) for nodes.
  # Exposes:
  #   GET  /quality/stats   → EpochSummary + MeshPoolStats
  #   POST /quality/search  → cosine similarity search over CPU pool
  quality-middleware:
    image: bs-quality-middleware:latest
    build:
      context: ../../../
      dockerfile: examples/quality-middleware/Dockerfile
    restart: unless-stopped
    ports:
      - "${QM_PORT:-9090}:9090"
    environment:
      - UPSTREAM_URL=${QM_UPSTREAM:-http://opengnk:8080}
      - LISTEN_PORT=9090
      - EPOCH_DURATION_SECS=${EPOCH_DURATION_SECS:-600}
    depends_on:
      opengnk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/quality/stats"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── BS Runtime: continuous slot distillation from live traffic ───────────────
  # Production mode: watches quality-middleware traffic, distills PatternSlots
  # from high-quality responses automatically. No experiment loop.
  #
  # Modes (BS_DISTILL_MODE):
  #   continuous — watch traffic, distill when quality ≥ threshold
  #   ingest    — one-shot: consume BS_RAW_INPUT, create slots, exit
  #   both      — ingest first, then switch to continuous
  bs-runtime:
    image: bs-runtime:latest
    build:
      context: ../../../binary-singularity
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      embedder:
        condition: service_healthy
      quality-middleware:
        condition: service_healthy
    volumes:
      - slots_data:/data/slots
      # Mount any raw input directory
      - ${BS_RAW_INPUT_DIR:-/tmp}:/mnt/raw-input:ro
    environment:
      - EMBED_URL=http://embedder:8686
      - QM_URL=http://quality-middleware:9090
      - STORE_DIR=/data/slots
      - HUB_URL=${HUB_URL:-https://gonka.gg/api/public/stats/historical}
      - HUB_KEY=${HUB_KEY:-}
      - BS_RAW_INPUT=${BS_RAW_INPUT:-}
      - BS_CHUNK_LINES=${BS_CHUNK_LINES:-50}
      - BS_MIN_SIM_BPS=${BS_MIN_SIM_BPS:-7500}
      - BS_DISTILL_MODE=${BS_DISTILL_MODE:-continuous}
      - BS_DISTILL_QUALITY_THRESHOLD=${BS_DISTILL_QUALITY_THRESHOLD:-0.70}
      - GONKA_API_KEY=${GONKA_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  slots_data:
