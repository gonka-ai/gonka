version: "3.9"

# ── LITE: Binary Singularity — CPU-only, single-node, no GPU required ────────
# Reproduces the full PatternSlot loop: embedder → cache → slots → metrics.
# Suitable for: CI, local dev, bookworm, any Linux x86_64 with 2GB RAM.
#
# Quick start:
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec runner ./runner --iterations 12 --models qwen3:4b,mistral
#
# Verified: Exp 2 (9216 runs, PQM 0.988), Exp 3 (K3s mesh, PQM 1.001)
# ─────────────────────────────────────────────────────────────────────────────

services:
  embedder:
    build:
      context: ../../../binary-singularity
      dockerfile: ../../../binary-singularity/Dockerfile.embedder
    image: bs-embedder:lite
    restart: unless-stopped
    ports:
      - "${EMBED_PORT:-8686}:8686"
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
      - BATCH_SIZE=32
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8686/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  mock-node:
    build:
      context: ../../../binary-singularity/mocknode
    image: bs-mocknode:lite
    restart: unless-stopped
    ports:
      - "${MOCK_NODE_PORT:-8082}:8082"
    environment:
      - PORT=8082
      - LOG_LEVEL=warn
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  runner:
    build:
      context: ../../../binary-singularity/scenarios/runner
    image: bs-runner:lite
    depends_on:
      embedder:
        condition: service_healthy
      mock-node:
        condition: service_healthy
    volumes:
      - slots_data:/data/slots
      - ./results:/results
      - ../../../binary-singularity/scenarios:/scenarios:ro
    environment:
      - EMBED_URL=http://embedder:8686
      - DAPI_URL=http://mock-node:8082
      - STORE_DIR=/data/slots
      - OUTPUT_DIR=/results
      - HUB_URL=${HUB_URL:-https://gonka.gg/api/public/stats/historical}
      - HUB_KEY=${HUB_KEY:-}
      - HUB_THRESHOLD=${HUB_THRESHOLD:-0.95}
    command: >
      ./runner
        --matrix /scenarios/scenario_matrix.json
        --iterations ${ITERATIONS:-12}
        --models ${MODELS:-mock}
        --embed http://embedder:8686
        --dapi http://mock-node:8082
        --store /data/slots
        --output /results
        --hub-url ${HUB_URL:-https://gonka.gg/api/public/stats/historical}
        --hub-key ${HUB_KEY:-}
    deploy:
      resources:
        limits:
          memory: 256M

  gonka-agent:
    build:
      context: ../../../../gonka-agent
      dockerfile: Dockerfile
    image: gonka-agent:lite
    depends_on:
      embedder:
        condition: service_healthy
      mock-node:
        condition: service_healthy
    volumes:
      - slots_data:/data/slots
      - ${BS_RAW_INPUT:-/dev/null}:/mnt/raw-input:ro
    environment:
      - GONKA_API_KEY=${GONKA_API_KEY:-}
      - GONKA_SOURCE_URL=http://mock-node:8082
      - BS_EMBED_URL=http://embedder:8686
      - BS_QUALITY_URL=http://mock-node:8082
      - BS_SLOT_DIR=/data/slots
      - BS_RAW_INPUT=${BS_RAW_INPUT:+/mnt/raw-input}
      - BS_CHUNK_LINES=${BS_CHUNK_LINES:-50}
      - BS_MIN_SIM_BPS=${BS_MIN_SIM_BPS:-7500}
      - BS_DISTILL_MODE=${BS_DISTILL_MODE:-continuous}
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  slots_data:
