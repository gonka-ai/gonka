services:
  mlnode-308:
    # CUDA 12.9 fallback: ghcr.io/gonka-ai/mlnode:3.0.16-cu129@sha256:f3db246b45dbe7f71cb9d8ad8ab15877d31bf28f742da04eed22b177d78e62c3
    image: ${MLNODE_IMAGE:-ghcr.io/gonka-ai/mlnode:3.0.16@sha256:1b9b7ce55feecab837f1d7ce974fc5f377ae0a04a4fb403eeeb50130e7728ee1}
    hostname: mlnode-308
    volumes:
      - ${HF_HOME:-${HOME}/.cache}:/root/.cache
    environment:
      - HF_HOME=/root/.cache
      # PoC batch (set in .env), the batch both prefill mining and validation use. Its forward is
      # batch x 1024 tokens and must fit --max-num-batched-tokens: vLLM sizes its MoE workspace by
      # that at startup, and a larger batch fails (0 nonces) instead of slowing down.
      # GLM-5.3-Flash: 8 on 8xH100, 16 on H200, 32 on B200/B300. DeepSeek-V4-Flash on 4xH100
      # (max-num-batched-tokens 16384): 16. Everything else: 32.
      - POC_BATCH_SIZE_DEFAULT=${POC_BATCH_SIZE_DEFAULT:-32}
      # DeepSeek-V4-Flash on 2xH200: set to 0 in .env. vLLM 0.30 otherwise takes its CUDA-graph estimate
      # (6.7 GiB) off the KV cache, which then holds fewer than the 1024 decode-PoC rows x 512 tokens, and
      # mining preempts (383 nonces/min instead of ~640). vLLM reads it as an int: keep a number here.
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: uvicorn api.app:app --host=0.0.0.0 --port=8080
    restart: always

  inference:
    image: nginx:1.28.0
    hostname: inference
    ports:
      - "${PORT:-8080}:8080"
      - "${INFERENCE_PORT:-5050}:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
