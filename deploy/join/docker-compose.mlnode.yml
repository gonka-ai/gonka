services:
  mlnode-308:
    # CUDA 12.9 fallback: ghcr.io/gonka-ai/mlnode:3.0.16-cu129@sha256:f3db246b45dbe7f71cb9d8ad8ab15877d31bf28f742da04eed22b177d78e62c3
    image: ${MLNODE_IMAGE:-ghcr.io/gonka-ai/mlnode:4.0.0-sigma2@sha256:ecf2d13da18494a8583f6810a98004df9ea7fae714c8710c1bb935d34c5ca8e7}
    hostname: mlnode-308
    volumes:
      - ${HF_HOME:-${HOME}/.cache}:/root/.cache
    environment:
      - HF_HOME=/root/.cache
      # Model-specific image and PoC settings: docs/mlnode-configs.md.
      - POC_BATCH_SIZE_DEFAULT=${POC_BATCH_SIZE_DEFAULT:-32}
      - POC_WORKER_MINING=${POC_WORKER_MINING:-0}
      - POC_CALLBACK_INTERVAL_SEC=${POC_CALLBACK_INTERVAL_SEC:-5}
      # Set to 0 for DeepSeek-V4-Flash on 2xH200 (see docs/mlnode-configs.md).
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command: uvicorn api.app:app --host=0.0.0.0 --port=8080
    restart: always

  inference:
    image: nginx:1.28.0
    hostname: inference
    ports:
      - "${PORT:-8080}:8080"
      - "${INFERENCE_PORT:-5050}:5000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
