# Alerts on the devshard gateway's own families (devshard/cmd/gateway/docs/operations.md, "Metrics"); devshard/cmd/gateway/metrics/deploy_queries_test.go fails when one names a family the gateway does not declare.
groups:
  - name: devshard-gateway
    rules:
      - alert: GatewayChainSnapshotUnhealthy
        expr: devshard_gateway_chain_snapshot_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Chain snapshot refresh failing on {{ $labels.instance }}"
          description: "The gateway's last chain observer refresh failed and has kept failing for 2 minutes; past GATEWAY_CHAIN_SNAPSHOT_MAX_AGE_SECONDS requests are refused as stale."
      - alert: GatewayOwedTimeoutVotesHigh
        expr: devshard_gateway_owed_timeout_votes > 64
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} timeout votes owed on {{ $labels.instance }}"
          description: "Votes taken from finished races and not yet posted have stayed above 64, the default engine_max_concurrent_timeout_votes, for 15 minutes; set the threshold to the override where one is set."
      - alert: GatewayEscrowDeadlineUnsettled
        expr: increase(devshard_gateway_escrow_deadline_unsettled_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Escrow of {{ $labels.model }} unsettled at its deadline ({{ $labels.reason }})"
          description: "The deadline rule narrated an escrow unsettled at its settle margin or past it in the last 15 minutes; an escrow the chain prunes unsettled is split across its group and its creator gets no refund."
      - alert: GatewayHostsEjectedAcrossTheFleet
        expr: sum by (instance, model) (devshard_gateway_host_ejected) / count by (instance, model) (devshard_gateway_host_ejected) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Over half the hosts of {{ $labels.model }} ejected on {{ $labels.instance }}"
          description: "Outlier detection has withheld more than half of the model's hosts from routing for 5 minutes, which points at the fleet or at the gateway's own view of it rather than at single hosts."
