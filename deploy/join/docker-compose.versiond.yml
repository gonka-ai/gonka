# Multi-versiond + sticky router overlay for deploy/join.
#
# Requires base docker-compose.yml (single versiond). Adds devshard-postgres and
# a second versiond instance (versiond2), attaches both to the router backend
# network, and sends policy-worker devshard traffic through proxy-router. The
# independently managed versiond-router slots are not services in this model.
#
#   docker compose -f docker-compose.yml -f docker-compose.versiond.yml up -d
#
# Every router discovers the pool from DNS: both versiond containers answer to the
# versiond-pool alias, so adding or removing an instance needs no router config
# and no reload. Health comes from active /readyz checks against each host, so a
# versiond that is draining, still converging on a new version, or simply
# stopped leaves the rotation on its own.
#
# x-versiond anchor holds everything shared between versiond and versiond2;
# only container_name and per-instance data volumes differ.

x-versiond: &versiond
  image: >-
    ${VERSIOND_IMAGE:-ghcr.io/product-science/versiond:0.2.15-devshard-v5}
  environment:
    - VERSIOND_ORACLE_URL=http://api:9100/versions
    - VERSIOND_BINARY_NAME=devshardd
    - VERSIOND_HOST_SHUTDOWN_BUDGET=${VERSIOND_HOST_SHUTDOWN_BUDGET:-25m}
    # Keep serving after /readyz starts failing, so the router observes the
    # failure before this host stops accepting work.
    - VERSIOND_DRAIN_ANNOUNCE=${VERSIOND_DRAIN_ANNOUNCE:-5s}
    # Marks the deployment as HA for every devshardd child: the child refuses to
    # boot on storage a sibling cannot see, and the router stamps the matching
    # Devshard-Ha header. Not overridable — it describes this overlay.
    - GONKA_HA=true
    - NODE_MANAGER_ADDR=api:${NODE_MANAGER_GRPC_PORT:-9400}
    - NODE_HOST=node
    - KEY_NAME=${KEY_NAME}
    - ACCOUNT_PUBKEY=${ACCOUNT_PUBKEY}
    - KEYRING_BACKEND=${KEYRING_BACKEND:-file}
    - KEYRING_PASSWORD=${KEYRING_PASSWORD}
    - KEYRING_DIR=/root/.inference
    - DEVSHARD_OTEL_ENABLED=${DEVSHARD_OTEL_ENABLED:-false}
    - OTEL_ENDPOINT=${OTEL_ENDPOINT:-}
    - OTEL_HEADERS=${OTEL_HEADERS:-}
    - PGHOST=devshard-postgres
    - PGDATABASE=${DEVSHARD_POSTGRES_DB:-devshardd}
    - PGUSER=${DEVSHARD_POSTGRES_USER:-devshardd}
    - PGPASSWORD=${DEVSHARD_POSTGRES_PASSWORD:?DEVSHARD_POSTGRES_PASSWORD is required}
    # Postgres-only payloads/sessions. Fail boot if PG is down; migrate local
    # SQLite sessions into Postgres once at startup (no file/sqlite fallback).
    - DEVSHARD_STORAGE_MODE=postgres
  # One DNS name, one A record per running instance on the router-only backend
  # network: this is the pool. Router slots run in independent Compose projects.
  networks:
    default:
      aliases:
        - versiond-pool
    versiond-router-back:
      aliases:
        - versiond-pool
  depends_on:
    api:
      condition: service_started
    devshard-postgres:
      condition: service_healthy
  # Compose readiness is the same contract the router consumes. A successful
  # `up --wait` therefore means this host has reconciled and can receive work,
  # not merely that its PID exists. BusyBox is part of the Alpine versiond image.
  healthcheck:
    test:
      [
        "CMD",
        "/bin/busybox",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:8080/readyz",
      ]
    interval: 2s
    timeout: 3s
    retries: 3
    # Slow binary downloads may legitimately keep a new host unready. A passing
    # check still marks it healthy immediately during the start period.
    start_period: ${VERSIOND_HEALTH_START_PERIOD:-30m}
  # Outer Docker backstop; keep it greater than the internal host budget.
  stop_grace_period: ${VERSIOND_STOP_GRACE_PERIOD:-30m}
  restart: always

services:
  devshard-postgres:
    container_name: devshard-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DEVSHARD_POSTGRES_DB:-devshardd}
      POSTGRES_USER: ${DEVSHARD_POSTGRES_USER:-devshardd}
      POSTGRES_PASSWORD: ${DEVSHARD_POSTGRES_PASSWORD:?DEVSHARD_POSTGRES_PASSWORD is required}
      # Keep the image-declared /var/lib/postgresql/data volume mounted as the
      # v4 migration source. New and migrated clusters live on the stable bind.
      PGDATA: /var/lib/postgresql/gonka/data
      DEVSHARD_POSTGRES_ALLOW_EMPTY_INIT: ${DEVSHARD_POSTGRES_ALLOW_EMPTY_INIT:-false}
    entrypoint: ["/usr/local/bin/gonka-postgres-entrypoint"]
    command: ["postgres"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      # A physical copy from an existing v4 cluster can take longer than normal
      # database initialization. Successful checks still mark it healthy early.
      start_period: ${DEVSHARD_POSTGRES_START_PERIOD:-30m}
    volumes:
      # The old image-owned anonymous volume remains at /var/lib/postgresql/data.
      # Compose preserves it during an in-place `up`, and the entrypoint copies
      # it atomically into this operator-visible bind on the first v5 start.
      - ${DEVSHARD_POSTGRES_DATA_DIR:-./devshards/postgres}:/var/lib/postgresql/gonka:Z
      - ./devshard-postgres-entrypoint.sh:/usr/local/bin/gonka-postgres-entrypoint:ro,Z
      # Existing v4 installations always have downloaded versiond artifacts.
      # This read-only evidence prevents an accidental `down` from turning a
      # detached anonymous database volume into a silently empty new cluster.
      - ./devshards/bin:/var/lib/postgresql/gonka-existing-versiond:ro,z
    # Give the old v4 server time to checkpoint before the migration entrypoint
    # copies its stopped data directory. WAL recovery still handles a hard stop.
    stop_grace_period: ${DEVSHARD_POSTGRES_STOP_GRACE_PERIOD:-5m}
    restart: always

  versiond:
    <<: *versiond
    container_name: versiond
    # Persisted pool membership. Set to 0 in config.env before permanently
    # decommissioning this host; a plain `stop` is only a temporary evacuation.
    deploy:
      replicas: ${VERSIOND_REPLICAS:-1}
    volumes:
      - .inference:/root/.inference:ro
      - ./devshards/bin:/opt/versiond/bin
      - ./devshards/data:/opt/versiond/data

  versiond2:
    <<: *versiond
    container_name: versiond2
    deploy:
      replicas: ${VERSIOND2_REPLICAS:-1}
    volumes:
      - .inference:/root/.inference:ro
      - ./devshards/bin:/opt/versiond/bin
      - ./devshards2/data:/opt/versiond/data

  proxy-policy:
    environment:
      - VERSIOND_SERVICE_NAME=proxy
      - VERSIOND_SERVICE_IS_ABSOLUTE=true
      - VERSIOND_PORT=18081

  proxy:
    environment:
      - VERSIOND_ROUTER_POOL_HOST=${VERSIOND_ROUTER_POOL_HOST:-versiond-router}
      - VERSIOND_ROUTER_PORT=8080
      - VERSIOND_ROUTER_ADMIN_PORT=8404
      - VERSIOND_ROUTER_FLEET_CAPACITY=${VERSIOND_ROUTER_FLEET_CAPACITY:-16}
      - VERSIOND_NON_HA_VERSIONS=${VERSIOND_NON_HA_VERSIONS-v1 v2 v3}
      - VERSIOND_VERSIONS=${VERSIOND_VERSIONS-v4 v5 v6 v7 v8}
    networks:
      default: {}
      versiond-router-front: {}

networks:
  versiond-router-front:
    name: ${VERSIOND_ROUTER_FRONT_NETWORK:-gonka-versiond-router-front}
  versiond-router-back:
    name: ${VERSIOND_ROUTER_BACK_NETWORK:-gonka-versiond-router-back}
