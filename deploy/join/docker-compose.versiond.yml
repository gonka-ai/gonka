# Multi-versiond + sticky router overlay for deploy/join.
#
# Requires base docker-compose.yml (single versiond). Adds devshard-postgres,
# a second versiond instance (versiond2), and the shared networks used by the
# independently managed versiond-router fleet. More local replicas are added
# with docker-compose.versiond3.yml (and copies of it); replicas on other
# machines with docker-compose.versiond-remote.yml.
#
# Fresh installations only: an existing host is moved to this model by the
# release updater, update-devshard.sh. The overlay uses !reset and requires
# Docker Compose 2.24.4 or newer.
#
# Cold-start order (update-devshard.sh runs the same steps on an existing host):
#   ./versiond-router-fleet.sh prepare-networks
#   docker compose -f docker-compose.yml -f docker-compose.versiond.yml up -d
#   ./versiond-router-fleet.sh apply
# Stop the fleet before taking the main Compose project down; active fleet slots
# remain attached to the shared external networks by design.
#
# x-versiond anchor holds everything shared between versiond and versiond2;
# only container_name and per-instance data volumes differ.

x-versiond: &versiond
  image: >-
    ${VERSIOND_IMAGE:-ghcr.io/product-science/versiond:0.2.15-devshard-v5}
  environment:
    - VERSIOND_ORACLE_URL=http://api:9100/versions
    - VERSIOND_BINARY_NAME=devshardd
    # This overlay can run multiple devshardd instances for one escrow. Make
    # every HA-routed child fail closed unless it uses shared PostgreSQL storage.
    - GONKA_HA=${GONKA_HA:-true}
    # Keep supervisor preflight aligned with the router: these versions remain
    # single-owner and do not require the HA storage contract.
    - VERSIOND_NON_HA_VERSIONS=${VERSIOND_NON_HA_VERSIONS-v1 v2 v3}
    - VERSIOND_HOST_SHUTDOWN_BUDGET=${VERSIOND_HOST_SHUTDOWN_BUDGET:-25m}
    # Keep serving after /readyz starts failing so the active router check can
    # withdraw this host before admission closes.
    - VERSIOND_DRAIN_ANNOUNCE=${VERSIOND_DRAIN_ANNOUNCE:-5s}
    - NODE_MANAGER_ADDR=api:${NODE_MANAGER_GRPC_PORT:-9400}
    - NODE_HOST=node
    - KEY_NAME=${KEY_NAME}
    - ACCOUNT_PUBKEY=${ACCOUNT_PUBKEY}
    - KEYRING_BACKEND=${KEYRING_BACKEND:-file}
    - KEYRING_PASSWORD=${KEYRING_PASSWORD}
    - KEYRING_DIR=/root/.inference
    - DEVSHARD_OTEL_ENABLED=${DEVSHARD_OTEL_ENABLED:-false}
    - OTEL_ENDPOINT=${OTEL_ENDPOINT:-}
    - OTEL_HEADERS=${OTEL_HEADERS:-}
    - PGHOST=devshard-postgres
    - PGDATABASE=${DEVSHARD_POSTGRES_DB:-devshardd}
    - PGUSER=${DEVSHARD_POSTGRES_USER:-devshardd}
    - PGPASSWORD=${DEVSHARD_POSTGRES_PASSWORD:?DEVSHARD_POSTGRES_PASSWORD is required}
    # Bound every child independently; pgx's CPU-sized default is unsafe when
    # several versions and generations share one PostgreSQL server.
    - PG_POOL_MAX_CONNS=${DEVSHARD_POSTGRES_POOL_MAX_CONNS:-4}
    # Postgres-only payloads/sessions. Fail boot if PG is down; migrate local
    # SQLite sessions into Postgres once at startup (no file/sqlite fallback).
    - DEVSHARD_STORAGE_MODE=postgres
  networks:
    default:
      aliases:
        - versiond-pool
    versiond-router-back:
      aliases:
        - versiond-pool
  depends_on:
    api:
      condition: service_started
    devshard-postgres:
      condition: service_healthy
  # The pinned transition image predates /readyz. Fall back to its liveness
  # endpoint only for an explicit 404; a lifecycle 503 must stay unhealthy.
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        output=$$(/bin/busybox wget -S -O /dev/null
        http://127.0.0.1:8080/readyz 2>&1);
        status=$$?;
        if [ "$$status" -eq 0 ]; then exit 0; fi;
        case "$$output" in *"HTTP/"*" 404 "*) exec /bin/busybox wget -q
        -O /dev/null http://127.0.0.1:8080/healthz ;; *) exit "$$status" ;; esac
    interval: 2s
    timeout: 3s
    retries: 3
    start_period: ${VERSIOND_HEALTH_START_PERIOD:-30m}
  stop_grace_period: ${VERSIOND_STOP_GRACE_PERIOD:-30m}
  restart: always

services:
  devshard-postgres:
    container_name: devshard-postgres
    image: >-
      ${DEVSHARD_POSTGRES_IMAGE:-postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777}
    environment:
      POSTGRES_DB: ${DEVSHARD_POSTGRES_DB:-devshardd}
      POSTGRES_USER: ${DEVSHARD_POSTGRES_USER:-devshardd}
      POSTGRES_PASSWORD: ${DEVSHARD_POSTGRES_PASSWORD:?DEVSHARD_POSTGRES_PASSWORD is required}
      # Keep the image-owned /var/lib/postgresql/data volume mounted as the v4
      # migration source. The durable cluster lives in the bind below.
      PGDATA: /var/lib/postgresql/gonka/data
      DEVSHARD_POSTGRES_ALLOW_EMPTY_INIT: ${DEVSHARD_POSTGRES_ALLOW_EMPTY_INIT:-false}
    entrypoint: ["/usr/local/bin/gonka-postgres-entrypoint"]
    command: ["postgres"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -AtX -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: ${DEVSHARD_POSTGRES_START_PERIOD:-30m}
    volumes:
      - ${DEVSHARD_POSTGRES_DATA_DIR:-./devshards/postgres}:/var/lib/postgresql/gonka:Z
      - ./devshard-postgres-entrypoint.sh:/usr/local/bin/gonka-postgres-entrypoint:ro,z
      # .pg-bound is definitive evidence that PostgreSQL still owns sessions.
      # Downloaded artifacts alone leave an explicit first-HA-vs-lost-volume
      # decision for the operator; both checks happen before empty init.
      - ./devshards/bin:/var/lib/postgresql/gonka-existing-versiond:ro,z
      - ./devshards/data:/var/lib/postgresql/gonka-versiond-data:ro,z
      - ./devshards2/data:/var/lib/postgresql/gonka-versiond2-data:ro,z
    stop_grace_period: ${DEVSHARD_POSTGRES_STOP_GRACE_PERIOD:-5m}
    restart: always

  versiond:
    <<: *versiond
    container_name: versiond
    deploy:
      replicas: ${VERSIOND_REPLICAS:-1}
    volumes:
      - .inference:/root/.inference:ro
      - ./devshards/bin:/opt/versiond/bin
      - ./devshards/data:/opt/versiond/data

  versiond2:
    <<: *versiond
    container_name: versiond2
    deploy:
      replicas: ${VERSIOND2_REPLICAS:-1}
    volumes:
      - .inference:/root/.inference:ro
      - ./devshards/bin:/opt/versiond/bin
      - ./devshards2/data:/opt/versiond/data

  proxy-policy:
    # Policy nginx can serve every non-devshard route while the HA versiond
    # stack is still starting or its PostgreSQL dependency is unavailable.
    depends_on:
      versiond: !reset null
    environment:
      - VERSIOND_SERVICE_NAME=proxy-policy-ingress
      - VERSIOND_SERVICE_IS_ABSOLUTE=true
      - VERSIOND_PORT=18081

  proxy-policy2:
    depends_on:
      versiond: !reset null
    environment:
      - VERSIOND_SERVICE_NAME=proxy-policy-ingress
      - VERSIOND_SERVICE_IS_ABSOLUTE=true
      - VERSIOND_PORT=18081

  proxy:
    environment:
      - VERSIOND_ROUTER_POOL_HOST=${VERSIOND_ROUTER_POOL_HOST:-versiond-router-fleet}
      - VERSIOND_ROUTER_PORT=8080
      - VERSIOND_ROUTER_ADMIN_PORT=8404
      - VERSIOND_ROUTER_FLEET_CAPACITY=${VERSIOND_ROUTER_FLEET_CAPACITY:-16}
      - VERSIOND_NON_HA_VERSIONS=${VERSIOND_NON_HA_VERSIONS-v1 v2 v3}
      - VERSIOND_VERSIONS=${VERSIOND_VERSIONS-v4 v5}
      - VERSIOND_ROUTING_CATALOG_URL=${VERSIOND_ROUTING_CATALOG_URL-http://api:9100/versions}
      - VERSIOND_ROUTING_CATALOG_POLL_SECONDS=${VERSIOND_ROUTING_CATALOG_POLL_SECONDS:-5}
      - VERSIOND_ROUTING_CATALOG_FETCH_TIMEOUT_SECONDS=${VERSIOND_ROUTING_CATALOG_FETCH_TIMEOUT_SECONDS:-3}
      - VERSIOND_ROUTING_CATALOG_MAX_BYTES=${VERSIOND_ROUTING_CATALOG_MAX_BYTES:-1048576}
      - VERSIOND_ROUTING_CATALOG_RUNTIME_TIMEOUT_SECONDS=${VERSIOND_ROUTING_CATALOG_RUNTIME_TIMEOUT_SECONDS:-2}
      - VERSIOND_ROUTING_CATALOG_ALLOW_REMOVALS=${VERSIOND_ROUTING_CATALOG_ALLOW_REMOVALS:-false}
      - PROXY_ROUTER_ACTIVATION_MIN_READY=${PROXY_ROUTER_ACTIVATION_MIN_READY:-2}
      - PROXY_ROUTER_VERSION_CAPACITY=${PROXY_ROUTER_VERSION_CAPACITY:-32}
      - PROXY_ROUTER_CATALOG_BIND_HOST=versiond-routing-oracle
      - PROXY_ROUTER_CATALOG_PORT=9100
      - PROXY_ROUTER_CATALOG_UPSTREAM_HOST=api
      - PROXY_ROUTER_CATALOG_UPSTREAM_PORT=9100
    networks:
      default: {}
      proxy-policy-front: {}
      versiond-router-front: {}
      versiond-router-back:
        aliases:
          - versiond-routing-oracle

networks:
  versiond-router-front:
    name: ${VERSIOND_ROUTER_FRONT_NETWORK:-gonka-versiond-router-front}
    external: true
  versiond-router-back:
    name: ${VERSIOND_ROUTER_BACK_NETWORK:-gonka-versiond-router-back}
    external: true
