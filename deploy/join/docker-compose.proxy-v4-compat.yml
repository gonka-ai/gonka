# Rollback model for the one-time public ingress cutover. It recreates the
# previous nginx service from the exact image captured by enable-router-ha.sh.
# Never include this file during normal operation.
services:
  proxy:
    image: ${PROXY_V4_IMAGE:?PROXY_V4_IMAGE is required}
    environment:
      - NGINX_MODE=${NGINX_MODE:-http}
      - SERVER_NAME=${SERVER_NAME:-}
      - GONKA_API_PORT=9000
      - GONKA_API_EXEMPT_ROUTES=chat inference poc/proofs subnet devshard
      - EXEMPT_CONN_LIMIT=200
      - GONKA_API_BLOCKED_ROUTES=poc-batches training
      - CHAIN_RPC_PORT=26657
      - CHAIN_API_PORT=1317
      - CHAIN_GRPC_PORT=9090
      - DASHBOARD_PORT=5173
      - PROXY_REAL_IP_FROM=172.18.0.1
      - CERT_ISSUER_DOMAIN=${CERT_ISSUER_DOMAIN:-}
      - PROXY_ADD_NODE_PREFIX=${PROXY_ADD_NODE_PREFIX:-false}
      - PROXY_SSL_SERVICE_NAME=${PROXY_SSL_SERVICE_NAME:-proxy-ssl}
      - PROXY_SSL_PORT=${PROXY_SSL_PORT:-8080}
      - DISABLE_GONKA_API=${DISABLE_GONKA_API:-false}
      - DISABLE_CHAIN_API=${DISABLE_CHAIN_API:-true}
      - DISABLE_CHAIN_RPC=${DISABLE_CHAIN_RPC:-true}
      - DISABLE_CHAIN_GRPC=${DISABLE_CHAIN_GRPC:-true}
      - DISABLE_VALIDATOR_WHITELIST=${DISABLE_VALIDATOR_WHITELIST:-true}
      - DISABLE_FAIL2BAN=${DISABLE_FAIL2BAN:-true}
      - EDGE_API_SERVICE_NAME=${PROXY_V4_EDGE_API_SERVICE_NAME:-}
      - EDGE_API_PORT=18080
      - VERSIOND_SERVICE_NAME=${PROXY_V4_VERSIOND_SERVICE_NAME:-versiond}
      - VERSIOND_PORT=8080
      - PROXY_PROTOCOL=false
      - VERSIOND_SERVICE_IS_ABSOLUTE=false
      - EDGE_API_SERVICE_IS_ABSOLUTE=false
    volumes:
      - ${SSL_CERT_SOURCE:-./secrets/nginx-ssl}:/etc/nginx/ssl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 10s
