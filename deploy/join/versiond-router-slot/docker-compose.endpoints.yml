# Explicit versiond pool membership for one router slot.
#
# versiond-router-fleet.sh adds this file to every slot's Compose command when
# config.env sets VERSIOND_POOL_ENDPOINTS_FILE. It mounts the operator's
# endpoint list read-only and records its SHA-256 in the container environment,
# so an edited list changes the rendered slot contract and `apply` rolls the
# fleet one slot at a time. Do not pass this file by hand.
services:
  router:
    environment:
      - VERSIOND_POOL_ENDPOINTS_FILE=/etc/gonka/versiond-endpoints.json
      - VERSIOND_POOL_ENDPOINTS_SHA256=${VERSIOND_POOL_ENDPOINTS_SHA256:?set by versiond-router-fleet.sh}
    volumes:
      - ${VERSIOND_POOL_ENDPOINTS_HOST_FILE:?set by versiond-router-fleet.sh}:/etc/gonka/versiond-endpoints.json:ro,z
