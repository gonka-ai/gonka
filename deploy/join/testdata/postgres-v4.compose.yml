services:
  devshard-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devshardd
      POSTGRES_USER: devshardd
      POSTGRES_PASSWORD: test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devshardd -d devshardd"]
      interval: 1s
      timeout: 2s
      retries: 30
