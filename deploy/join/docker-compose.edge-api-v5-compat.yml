# Transitional singleton used only by upgrade-devshard-v5.sh while a v4
# installation still has the old public nginx. The steady-state proxy-router
# balances edge-api replicas directly.
services:
  edge-api-router:
    container_name: edge-api-router
    image: >-
      ${EDGE_API_ROUTER_IMAGE:-ghcr.io/product-science/edge-api-router:0.2.15-devshard-v5}
    environment:
      - EDGE_API_POOL_HOST=${EDGE_API_POOL_HOST:-edge-api-pool}
      - EDGE_API_PORT=18080
      - EDGE_API_HOSTS=${EDGE_API_HOSTS:-edge-api edge-api2 edge-api3}
    depends_on:
      - edge-api
      - edge-api2
      - edge-api3
    healthcheck:
      test:
        [
          "CMD",
          "/bin/busybox",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:18080/readyz",
        ]
      interval: 1s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: always
