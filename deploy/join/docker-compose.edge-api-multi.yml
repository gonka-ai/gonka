# Multi edge-api + round-robin router overlay for deploy/join.
#
# Requires base docker-compose.yml (single edge-api). Adds edge-api2,
# edge-api3, and edge-api-router in front of all three. Sets proxy
# EDGE_API_SERVICE_NAME=edge-api-router.
#
#   docker compose -f docker-compose.yml -f docker-compose.edge-api-multi.yml up -d
#
# x-edge-api anchor holds everything shared between instances.

x-edge-api: &edge-api
  image: ${EDGE_API_IMAGE:-ghcr.io/product-science/edge-api:0.2.15-devshard-v5}
  environment:
    - EDGE_API_PORT=18080
    - CHAIN_GRPC_URL=node:9090
    - CHAIN_RPC_URL=http://node:26657
    - EDGE_API_OTEL_ENABLED=${EDGE_API_OTEL_ENABLED:-false}
    - OTEL_ENDPOINT=${OTEL_ENDPOINT:-}
    - OTEL_HEADERS=${OTEL_HEADERS:-}
    # This overlay still uses the legacy nginx router, which does not observe
    # /readyz. A readiness-aware router enables the announce window separately.
    - EDGE_API_DRAIN_ANNOUNCE=${EDGE_API_DRAIN_ANNOUNCE:-0s}
    - EDGE_API_SHUTDOWN_BUDGET=${EDGE_API_SHUTDOWN_BUDGET:-2m}
  depends_on:
    - node
  healthcheck:
    test:
      [
        "CMD",
        "/bin/busybox",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:18080/readyz",
      ]
    interval: 1s
    timeout: 3s
    retries: 3
    start_period: ${EDGE_API_HEALTH_START_PERIOD:-2m}
  # Outer Docker backstop; must exceed announce + shutdown budget.
  stop_grace_period: ${EDGE_API_STOP_GRACE_PERIOD:-3m}
  restart: always

services:
  # The instance from the base file takes the same lifecycle-aware image and
  # shutdown settings as its siblings.
  edge-api:
    <<: *edge-api

  edge-api2:
    <<: *edge-api
    container_name: edge-api2

  edge-api3:
    <<: *edge-api
    container_name: edge-api3

  edge-api-router:
    container_name: edge-api-router
    image: ghcr.io/product-science/edge-api-router:0.2.14-devshard-v4
    environment:
      - EDGE_API_HOSTS=${EDGE_API_HOSTS:-edge-api edge-api2 edge-api3}
      - EDGE_API_PORT=18080
    depends_on:
      - edge-api
      - edge-api2
      - edge-api3
    restart: always

  proxy:
    environment:
      - EDGE_API_SERVICE_NAME=edge-api-router
