# Publish, on the private interface of the network node only, the endpoints a
# versiond on another machine needs: chain gRPC and RPC, the node manager, and
# the shared PostgreSQL. The API's /versions feed on port 9100 is already
# published by the base file.
#
# Add this file after docker-compose.versiond.yml in every Compose command of
# the network node, set GONKA_PRIVATE_BIND_IP in config.env, and firewall these
# ports from the public network. Remote hosts are listed in the endpoint file
# named by VERSIOND_POOL_ENDPOINTS_FILE; see docker-compose.versiond-remote.yml
# for the other side.

services:
  node:
    ports:
      - "${GONKA_PRIVATE_BIND_IP:?set GONKA_PRIVATE_BIND_IP in config.env}:9090:9090"
      - "${GONKA_PRIVATE_BIND_IP:?set GONKA_PRIVATE_BIND_IP in config.env}:26657:26657"

  api:
    ports:
      - "${GONKA_PRIVATE_BIND_IP:?set GONKA_PRIVATE_BIND_IP in config.env}:${NODE_MANAGER_GRPC_PORT:-9400}:${NODE_MANAGER_GRPC_PORT:-9400}"

  devshard-postgres:
    ports:
      - "${GONKA_PRIVATE_BIND_IP:?set GONKA_PRIVATE_BIND_IP in config.env}:${DEVSHARD_POSTGRES_PRIVATE_PORT:-5432}:5432"
