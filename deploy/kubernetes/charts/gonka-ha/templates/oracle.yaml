apiVersion: v1
kind: Service
metadata:
  name: {{ include "gonka.fullname" . }}-oracle
  labels:
    {{- include "gonka.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gonka.selector" (dict "root" . "component" "oracle") | nindent 4 }}
  ports:
    - name: http
      port: 9100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gonka.fullname" . }}-oracle
  labels:
    {{- include "gonka.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.oracle.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "gonka.selector" (dict "root" . "component" "oracle") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gonka.selector" (dict "root" . "component" "oracle") | nindent 8 }}
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/scripts.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      {{- include "gonka.scheduling" (dict "root" . "component" "oracle" "config" .Values.oracle) | nindent 6 }}
      containers:
        - name: oracle
          image: {{ .Values.images.oracle | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [python3, -B, /opt/gonka/oracle.py]
          env:
            - name: ORACLE_UPSTREAM
              value: {{ .Values.external.oracleUrl | quote }}
            - name: ORACLE_ALLOW
              value: {{ join " " .Values.protocols | quote }}
          ports:
            - {name: http, containerPort: 9100}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.oracle.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: scripts, mountPath: /opt/gonka, readOnly: true}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "gonka.fullname" . }}-scripts
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gonka.fullname" . }}-oracle
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "gonka.selector" (dict "root" . "component" "oracle") | nindent 6 }}
