# Participants section auto-generated by gencompose — re-generate with: make gen-compose
# Observability section (bottom) is manually maintained.

networks:
  testenv:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:

  # ── Mock mainnet gRPC server ───────────────────────────────────────────────
  mock-server:
    build:
      context: .
      dockerfile: Dockerfile.mockserver
    image: subnet-mockserver:latest
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "9090:9090"
      - "9091:9091"
    networks:
      testenv:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # ── participant-0 (slots: 0,10) ───────────────────────────
  participant-0:
    build:
      context: .
      dockerfile: Dockerfile.subnethost
    image: subnet-host:latest
    environment:
      TESTENV_PRIVATE_KEY: "2b67cbaced1fd6fa4a5df8ae638c29c14faba15c4bf3c09cf3520f42783cc678"
      TESTENV_ESCROW_ID: "1"
      TESTENV_MOCK_SERVER: "mock-server:9090"
      TESTENV_PORT: "8080"
    networks:
