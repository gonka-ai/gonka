# Shared by every Go module in the repository. Rationale for each choice: docs/linting.md.

version: "2"
run:
  timeout: 5m

linters:
  enable:
    # Resource leaks and silently swallowed failures.
    - rowserrcheck
    - errorlint
    - errchkjson
    - gosec
    - protogetter
    - noctx
    - depguard
    - nilnesserr
    - durationcheck
    - fatcontext
    - copyloopvar
    - makezero
    - reassign
    - recvcheck
    - spancheck
    # Conventions the code already follows.
    - errname
    - gochecknoinits
    - misspell
    - dupword
    - nolintlint
    - usestdlibvars
    - predeclared
    # Correctness and dead weight the compiler does not see.
    - gocritic
    - unconvert
    - intrange
    - modernize
    - revive
    - exhaustive
    - mirror
    # The assertions themselves, not just the code around them.
    - testifylint
    - thelper
  settings:
    govet:
      enable:
        - unusedwrite
    modernize:
      disable:
        - fmtappendf
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G404
        - G115
        - G104
        - G706
    depguard:
      rules:
        crypto-randomness:
          files:
            - "**/signing/**"
            - "**/keymaterial/**"
          deny:
            - pkg: math/rand
              desc: key material and signatures need crypto/rand; math/rand is for the deterministic paths
            - pkg: math/rand/v2
              desc: key material and signatures need crypto/rand; math/rand is for the deterministic paths
    staticcheck:
      checks:
        - all
        - -SA1019
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    testifylint:
      disable:
        - encoded-compare
        - float-compare
    revive:
      rules:
        - name: var-naming
        - name: receiver-naming
        - name: import-shadowing
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (io.Closer).Close
        - (*os.File).Close
        - io.Copy
        - (*devshard/storage.SQLite).Close
        - (*devshard/accounting.Store).Close
        - (*devshard/user.Session).Close
        - (*common/nodemanager.Client).Close
        - (*devshard/cmd/devshardctl.PerfStore).Close
        - (*devshard/cmd/devshardctl.devshardRuntime).close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      - path: (_test\.go|/testenv/|/e2e/)
        linters: [gosec, noctx]
      - path: test-net-cloud/
        linters: [noctx]
      - text: 'must not be called\. use \(\*database/sql'
        linters: [noctx]
      - path: (^|/)x/
        linters: [gochecknoinits]
      - path: .
        linters: [gofumpt, goimports]

formatters:
  enable:
    - gci
    - goimports
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
