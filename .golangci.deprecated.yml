# Deprecated APIs, reported and never enforced. Run with `make lint-deprecated`; see docs/linting.md.

version: "2"
run:
  timeout: 5m

linters:
  default: none
  enable:
    - staticcheck
  settings:
    staticcheck:
      checks:
        - SA1019

severity:
  default: warning

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
