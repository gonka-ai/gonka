# edge-api overlay: canonical edge-api + 2 extras (3 total) and the HAProxy
# edge-api-router for round-robin Tier A query traffic.
#
# The router finds instances through the ${KEY_NAME}-edge-api-pool alias and
# drops any that fails /readyz, so a node that loses the chain stops taking
# queries without being restarted.
#
# Paths are relative to --project-directory (repo root). Typical stack:
#   base + genesis|join + edge-api [+ edge-api-router-proxy on genesis]
#
# Single-instance default is docker-compose-base.yml (edge-api only).
# This overlay adds edge-api-2/3 and edge-api-router; pair with
# docker-compose.edge-api-router-proxy.yml so proxy uses the router.

x-edge-api: &edge-api
  image: edge-api:latest
  platform: ${DOCKER_PLATFORM:-linux/amd64}
  build:
    context: ${EDGE_API_BUILD_CONTEXT:-..}
    dockerfile: edge-api/Dockerfile
  environment:
    EDGE_API_PORT: "18080"
    CHAIN_GRPC_URL: ${KEY_NAME}-node:9090
    CHAIN_RPC_URL: http://${KEY_NAME}-node:26657
    EDGE_API_OTEL_ENABLED: ${EDGE_API_OTEL_ENABLED:-false}
    OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
    OTEL_HEADERS: ${OTEL_HEADERS:-}
  depends_on:
    - chain-node
  # Outer Docker backstop; must exceed announce + shutdown budget.
  stop_grace_period: 3m
  # One DNS name, one A record per running instance: this is the pool.
  networks:
    chain-public:
      aliases:
        - ${KEY_NAME}-edge-api-pool
  restart: unless-stopped

services:
  # The instance from docker-compose-base.yml joins the pool alias.
  edge-api:
    networks:
      chain-public:
        aliases:
          - ${KEY_NAME}-edge-api-pool

  edge-api-2:
    <<: *edge-api
    container_name: ${KEY_NAME}-edge-api-2

  edge-api-3:
    <<: *edge-api
    container_name: ${KEY_NAME}-edge-api-3

  edge-api-router:
    image: edge-api-router:latest
    # Its own directory, like versiond-router: the Dockerfile copies the config
    # template from beside itself.
    build:
      context: ./edge-api-router
      dockerfile: Dockerfile
    container_name: ${KEY_NAME}-edge-api-router
    environment:
      EDGE_API_POOL_HOST: ${EDGE_API_POOL_HOST:-${KEY_NAME}-edge-api-pool}
      EDGE_API_PORT: ${EDGE_API_PORT:-18080}
    depends_on:
      - edge-api
      - edge-api-2
      - edge-api-3
    networks:
      - chain-public
    restart: unless-stopped

networks:
  chain-public:
    name: chain-public
    external: true
