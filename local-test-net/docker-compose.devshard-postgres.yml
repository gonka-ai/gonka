# Genesis overlay: shared Postgres for devshardd payload/lease storage.
# Layer with docker-compose.versiond.yml on genesis only.
#
# Sets PG env on all versiond instances (see docker-compose.versiond.yml anchor).
# dapi keeps its per-node ${KEY_NAME}-postgres from docker-compose-base.yml.
# Versionless obs on dapi/edge-api uses DEVSHARD_OBS_PG* (session DB), not payload PG*.
# When also layering docker-compose.edge-api.yml, add docker-compose.devshard-obs-ha.yml
# last (or export the same DEVSHARD_OBS_PG* in the host env) so edge-api-2/3 get
# the session DB too.
services:
  devshard-postgres:
    container_name: devshard-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devshardd
      POSTGRES_USER: devshardd
      POSTGRES_PASSWORD: devshardd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devshardd -d devshardd"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - chain-public

  api:
    environment:
      DEVSHARD_OBS_PGHOST: devshard-postgres
      DEVSHARD_OBS_PGPORT: "5432"
      DEVSHARD_OBS_PGDATABASE: devshardd
      DEVSHARD_OBS_PGUSER: devshardd
      DEVSHARD_OBS_PGPASSWORD: devshardd

  edge-api:
    environment:
      DEVSHARD_OBS_PGHOST: devshard-postgres
      DEVSHARD_OBS_PGPORT: "5432"
      DEVSHARD_OBS_PGDATABASE: devshardd
      DEVSHARD_OBS_PGUSER: devshardd
      DEVSHARD_OBS_PGPASSWORD: devshardd

  versiond:
    environment:
      DEVSHARD_STORAGE_MODE: postgres
      PGHOST: devshard-postgres
      PGDATABASE: devshardd
      PGUSER: devshardd
      PGPASSWORD: devshardd
    depends_on:
      devshard-postgres:
        condition: service_healthy

  versiond-2:
    environment:
      DEVSHARD_STORAGE_MODE: postgres
      PGHOST: devshard-postgres
      PGDATABASE: devshardd
      PGUSER: devshardd
      PGPASSWORD: devshardd
    depends_on:
      devshard-postgres:
        condition: service_healthy

  versiond-3:
    environment:
      DEVSHARD_STORAGE_MODE: postgres
      PGHOST: devshard-postgres
      PGDATABASE: devshardd
      PGUSER: devshardd
      PGPASSWORD: devshardd
    depends_on:
      devshard-postgres:
        condition: service_healthy

networks:
  chain-public:
    name: chain-public
    external: true
