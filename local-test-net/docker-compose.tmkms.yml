services:
  tmkms:
    # TMKMS_IMAGE lets tests pin a specific build (e.g. a locally built
    # vote-extension-capable image, or the legacy 0.12 image for negative tests).
    image: ${TMKMS_IMAGE:-ghcr.io/product-science/tmkms-softsign-with-keygen}
    container_name: ${KEY_NAME}-tmkms
    restart: unless-stopped
    environment:
      - VALIDATOR_LISTEN_ADDRESS=tcp://${KEY_NAME}-node:${TMKMS_PORT:-26658}
    # Persist the consensus key, tmkms.toml and the double-sign state file across
    # container recreation (an image swap must keep the same key and state).
    volumes:
      - ./prod-local/${KEY_NAME}/.tmkms:/root/.tmkms
    networks:
      - chain-public

  chain-node:
    environment:
      - TMKMS_PORT=${TMKMS_PORT:-26658}
    expose:
      - "${TMKMS_PORT:-26658}"
    depends_on:
      - tmkms
