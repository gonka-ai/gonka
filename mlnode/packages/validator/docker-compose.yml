x-common-config: &common-config
  env_file:
    - ${PROJECT_ROOT}/.env
    - ${PROJECT_ROOT}/packages/validator/.env
  shm_size: "120g"
  volumes:
    - ${CACHE_DIR}:/root/.cache

services:
  server:
    <<: *common-config
    build:
      context: ${PROJECT_ROOT}
      dockerfile: packages/validator/Dockerfile
      target: app
    command: /app/packages/validator/.venv/bin/python -m validator.app
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              device_ids: ["${GPU_DEVICE_ID:-0}"]
    restart: always

  integration-tests:
    <<: *common-config
    build:
      context: ${PROJECT_ROOT}
      dockerfile: packages/validator/Dockerfile
      target: test
    environment:
      - SERVER_URL=http://server:8080
    depends_on:
      - server

  unit-tests:
    <<: *common-config
    build:
      context: ${PROJECT_ROOT}
      dockerfile: packages/validator/Dockerfile
      target: test
